# Mätprototyp, körs lokalt: npm run dev (wrangler dev --local). Inget konto behövs.
# Ingen account_id och ingen token finns här. database_id är D1-databasen i EU som Johnny skapade
# 2026-11-10 (ett id, inte en hemlighet). Lokalt används en egen lokal databas oavsett id.
name = "bubble-prototype-group"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "bubble-prototype"
database_id = "20a10f01-5a87-4de8-b3e6-10777885d741"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]

[vars]
# Origin som tillåts mot /api/*. Lokalt är det wrangler dev. Produktion: https://bubblesort.se
ALLOWED_ORIGINS = "http://localhost:8787,http://127.0.0.1:8787"
# TESTMILJÖ (ADR-003 avsnitt 12): får aldrig finnas i produktion.
TEST_MODE = "1"
